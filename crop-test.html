<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kırp & Oku v5</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f2eb;padding:1.5rem;max-width:500px;margin:0 auto}
h1{font-size:18px;margin-bottom:1rem;color:#1a1712}
#result{padding:1rem;background:#fff;border-radius:12px;border:1.5px solid #e0ddd5;min-height:40px;font-size:13px;margin-bottom:10px}
#found{padding:1rem;border-radius:12px;font-size:15px;font-weight:600;display:none;margin-bottom:10px;text-align:center}
.btn{display:block;width:100%;padding:12px;background:#c85a2a;color:#fff;border:none;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;text-align:center}
.btn.green{background:#2e7d52}.btn.gray{background:#7a7570}
input[type=file]{display:none}
#crop-wrap{margin-bottom:10px;display:none}
#crop-container{position:relative;background:#eee;border-radius:12px;overflow:hidden}
#crop-canvas{display:block;width:100%;touch-action:none}
#crop-box{position:absolute;border:2px solid #ff4400;background:rgba(255,68,0,0.2);pointer-events:none}
#preview-strip{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
#preview-strip img{max-width:100%;border:1px solid #ccc;background:#fff}
progress{width:100%;accent-color:#c85a2a;display:none;margin-bottom:10px}
</style>
</head>
<body>
<h1>✂️ Hassas Kırp & Oku v5</h1>

<div style="display:flex;gap:8px;margin-bottom:10px">
  <label class="btn" for="file-input" style="flex:1;margin:0">📷 Kamera</label>
  <label class="btn" for="gallery-input" style="flex:1;margin:0;background:#7a7570">🖼️ Galeri</label>
</div>

<input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFile(event)">
<input type="file" id="gallery-input" accept="image/*" onchange="handleFile(event)">

<div id="crop-wrap">
  <div id="crop-container">
    <canvas id="crop-canvas"></canvas>
    <div id="crop-box"></div>
  </div>
  <button class="btn green" onclick="doCrop()" style="margin-top:10px">🔍 Tarihi Oku</button>
</div>

<progress id="progress" max="100" value="0"></progress>
<div id="preview-strip"></div>
<div id="result">İşlem bekleniyor...</div>
<div id="found"></div>

<script>
let origImage = null;
let cropStart = null, cropEnd = null, dragging = false;
let imgScale = 1;

async function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    origImage = new Image();
    origImage.onload = () => {
      const canvas = document.getElementById('crop-canvas');
      const maxW = Math.min(window.innerWidth - 40, 480);
      imgScale = maxW / origImage.width;
      canvas.width = origImage.width * imgScale;
      canvas.height = origImage.height * imgScale;
      canvas.getContext('2d').drawImage(origImage, 0, 0, canvas.width, canvas.height);
      document.getElementById('crop-wrap').style.display = 'block';
      document.getElementById('preview-strip').innerHTML = '';
      addListeners();
    };
    origImage.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function addListeners() {
  const c = document.getElementById('crop-canvas');
  const getP = (e) => {
    const r = c.getBoundingClientRect();
    const s = e.touches ? e.touches[0] : e;
    return { x: (s.clientX - r.left), y: (s.clientY - r.top) };
  };
  const start = (e) => { e.preventDefault(); dragging = true; cropStart = getP(e); cropEnd = cropStart; updateBox(); };
  const move = (e) => { if (!dragging) return; cropEnd = getP(e); updateBox(); };
  const stop = () => { dragging = false; };
  
  c.onmousedown = start; c.ontouchstart = start;
  window.onmousemove = move; window.ontouchmove = move;
  window.onmouseup = stop; window.ontouchend = stop;
}

function updateBox() {
  const box = document.getElementById('crop-box');
  box.style.display = 'block';
  box.style.left = Math.min(cropStart.x, cropEnd.x) + 'px';
  box.style.top = Math.min(cropStart.y, cropEnd.y) + 'px';
  box.style.width = Math.abs(cropEnd.x - cropStart.x) + 'px';
  box.style.height = Math.abs(cropEnd.y - cropStart.y) + 'px';
}

async function doCrop() {
  if (!cropStart) return;
  document.getElementById('result').textContent = '⏳ Analiz ediliyor...';
  document.getElementById('progress').style.display = 'block';
  
  const x = Math.min(cropStart.x, cropEnd.x) / imgScale;
  const y = Math.min(cropStart.y, cropEnd.y) / imgScale;
  const w = Math.abs(cropEnd.x - cropStart.x) / imgScale;
  const h = Math.abs(cropEnd.y - cropStart.y) / imgScale;

  // Görüntü İşleme: Artık sert siyah-beyaz yapmıyoruz!
  const canvas = document.createElement('canvas');
  canvas.width = w * 3; canvas.height = h * 3;
  const ctx = canvas.getContext('2d');
  
  // Sadece hafif netleştirme ve gri tonlama
  ctx.filter = 'grayscale(1) brightness(1.1) contrast(1.4)';
  ctx.drawImage(origImage, x, y, w, h, 0, 0, canvas.width, canvas.height);

  const imgPrev = document.createElement('img');
  imgPrev.src = canvas.toDataURL();
  const strip = document.getElementById('preview-strip');
  strip.innerHTML = '<span>İşlenen Görüntü (Gri Tonlama):</span>';
  strip.appendChild(imgPrev);

  try {
    const worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789./- ',
      tessedit_pageseg_mode: '7'
    });

    const { data: { text } } = await worker.recognize(canvas);
    await worker.terminate();

    const clean = text.replace(/[^0-9./-]/g, '').trim();
    document.getElementById('result').textContent = 'Okunan: ' + (clean || "???");

    const date = extractDate(clean);
    const el = document.getElementById('found');
    el.style.display = 'block';
    if (date) {
      el.style.background = '#eaf4ee'; el.style.color = '#2e7d52';
      el.textContent = '✅ SKT: ' + date;
    } else {
      el.style.background = '#faecec'; el.style.color = '#b52b2b';
      el.textContent = '⚠️ Tarih seçilemedi. Lütfen daha dar kırpın.';
    }
  } catch (err) {
    document.getElementById('result').textContent = 'Hata: ' + err.message;
  }
  document.getElementById('progress').style.display = 'none';
}

function extractDate(t) {
  // 06.11.27 veya 061127 gibi yapıları arar
  const reg = /(\d{1,2})[./-]?(\d{1,2})[./-]?(\d{2,4})/;
  const m = t.match(reg);
  if (m) {
    let d = m[1], month = m[2], y = m[3];
    if (y.length === 2) y = "20" + y;
    // Gün/Ay mantık kontrolü
    if (parseInt(month) > 12 && parseInt(d) <= 12) [d, month] = [month, d];
    return `${y}-${month.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }
  return null;
}
</script>
</body>
</html>

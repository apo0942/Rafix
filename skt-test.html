<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SKT Kırp & Oku</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f2eb;padding:1.5rem;max-width:500px;margin:0 auto}
h1{font-size:20px;margin-bottom:1rem;color:#1a1712}
#result{padding:1rem;background:#fff;border-radius:12px;border:1.5px solid #e0ddd5;min-height:50px;font-size:13px;color:#1a1712;line-height:1.6;margin-bottom:10px}
#date-found{padding:1rem;background:#eaf4ee;border-radius:12px;font-size:16px;font-weight:600;color:#2e7d52;display:none;margin-bottom:10px;text-align:center}
.btn{display:block;width:100%;padding:12px;background:#c85a2a;color:#fff;border:none;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;font-family:system-ui;text-align:center}
.btn.secondary{background:#7a7570}
.btn.green{background:#2e7d52}
label.btn{display:block}
input[type=file]{display:none}
progress{width:100%;height:6px;border-radius:10px;display:none;margin-bottom:10px;accent-color:#c85a2a}
#crop-wrap{display:none;margin-bottom:10px}
#crop-hint{font-size:12px;color:#7a7570;text-align:center;margin-bottom:8px;padding:6px;background:#fff;border-radius:8px}
#crop-container{position:relative;user-select:none}
#crop-canvas{display:block;width:100%;border-radius:12px;border:1.5px solid #e0ddd5;touch-action:none}
#crop-box{position:absolute;border:2.5px solid #c85a2a;background:rgba(200,90,42,0.1);pointer-events:none;display:none}
#cropped-preview{display:none;width:100%;border-radius:8px;margin-bottom:10px;border:1.5px solid #2e7d52;image-rendering:pixelated}
</style>
</head>
<body>
<h1>🔍 SKT Kırp & Oku</h1>

<label class="btn" for="file-input">📸 Fotoğraf Çek / Seç</label>
<input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFile(event)">

<div id="crop-wrap">
  <div id="crop-hint">👆 SKT yazısını parmağınızla çerçeve içine alın</div>
  <div id="crop-container">
    <canvas id="crop-canvas"></canvas>
    <div id="crop-box"></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn green" onclick="doCrop()" style="flex:1;margin:0">✂️ Kırp ve Oku</button>
    <button class="btn secondary" onclick="resetCrop()" style="flex:1;margin:0">↺ Tekrar</button>
  </div>
</div>

<img id="cropped-preview">
<progress id="progress" max="100"></progress>
<div id="result">Fotoğraf seçin…</div>
<div id="date-found"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
let origImage = null;
let cropStart = null, cropEnd = null, dragging = false;
let imgScale = 1;

async function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  origImage = new Image();
  origImage.onload = () => {
    const canvas = document.getElementById('crop-canvas');
    const maxW = Math.min(window.innerWidth - 48, 480);
    imgScale = maxW / origImage.width;
    canvas.width  = origImage.width  * imgScale;
    canvas.height = origImage.height * imgScale;
    canvas.getContext('2d').drawImage(origImage, 0, 0, canvas.width, canvas.height);
    document.getElementById('crop-wrap').style.display = '';
    document.getElementById('result').textContent = 'SKT yazısının etrafını çizin → "Kırp ve Oku"';
    document.getElementById('date-found').style.display = 'none';
    document.getElementById('cropped-preview').style.display = 'none';
    document.getElementById('crop-box').style.display = 'none';
    URL.revokeObjectURL(url);
    addCropListeners();
  };
  origImage.src = url;
}

function addCropListeners() {
  const canvas = document.getElementById('crop-canvas');
  canvas.addEventListener('mousedown',  startDrag);
  canvas.addEventListener('mousemove',  moveDrag);
  canvas.addEventListener('mouseup',    stopDrag);
  canvas.addEventListener('touchstart', startDrag, {passive:false});
  canvas.addEventListener('touchmove',  moveDrag,  {passive:false});
  canvas.addEventListener('touchend',   stopDrag,  {passive:false});
}

function getCanvasPos(e) {
  const canvas = document.getElementById('crop-canvas');
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (canvas.width  / rect.width),
    y: (src.clientY - rect.top)  * (canvas.height / rect.height)
  };
}

function startDrag(e) {
  e.preventDefault();
  dragging = true;
  cropStart = getCanvasPos(e);
  cropEnd = cropStart;
  updateBox();
}
function moveDrag(e) {
  e.preventDefault();
  if (!dragging) return;
  cropEnd = getCanvasPos(e);
  updateBox();
}
function stopDrag(e) {
  e.preventDefault();
  dragging = false;
}

function updateBox() {
  if (!cropStart || !cropEnd) return;
  const canvas = document.getElementById('crop-canvas');
  const rect = canvas.getBoundingClientRect();
  const sx = rect.width  / canvas.width;
  const sy = rect.height / canvas.height;
  const box = document.getElementById('crop-box');
  const x = Math.min(cropStart.x, cropEnd.x) * sx;
  const y = Math.min(cropStart.y, cropEnd.y) * sy;
  const w = Math.abs(cropEnd.x - cropStart.x) * sx;
  const h = Math.abs(cropEnd.y - cropStart.y) * sy;
  box.style.display = 'block';
  box.style.left   = x + 'px';
  box.style.top    = y + 'px';
  box.style.width  = w + 'px';
  box.style.height = h + 'px';
}

function resetCrop() {
  cropStart = null; cropEnd = null;
  document.getElementById('crop-box').style.display = 'none';
  document.getElementById('result').textContent = 'SKT yazısının etrafını çizin.';
}

async function doCrop() {
  if (!cropStart || !cropEnd || !origImage) { alert('Önce bir alan seçin!'); return; }
  const x = Math.min(cropStart.x, cropEnd.x) / imgScale;
  const y = Math.min(cropStart.y, cropEnd.y) / imgScale;
  const w = Math.abs(cropEnd.x - cropStart.x) / imgScale;
  const h = Math.abs(cropEnd.y - cropStart.y) / imgScale;
  if (w < 30 || h < 10) { alert('Daha büyük alan seçin!'); return; }

  // Kırp + 3x büyüt
  const out = document.createElement('canvas');
  const factor = 3;
  out.width  = w * factor;
  out.height = h * factor;
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(origImage, x, y, w, h, 0, 0, out.width, out.height);

  // Kontrast
  const id = ctx.getImageData(0, 0, out.width, out.height);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const v = Math.min(255, Math.max(0, (g - 128) * 2 + 128));
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(id, 0, 0);

  const prev = document.getElementById('cropped-preview');
  prev.src = out.toDataURL('image/jpeg', 0.95);
  prev.style.display = 'block';

  document.getElementById('result').textContent = '⏳ Okunuyor…';
  document.getElementById('progress').style.display = 'block';
  document.getElementById('date-found').style.display = 'none';

  try {
    const result = await Tesseract.recognize(out, 'tur+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          document.getElementById('progress').value = Math.round(m.progress * 100);
          document.getElementById('result').textContent = 'OCR: %' + Math.round(m.progress * 100);
        }
      }
    });
    document.getElementById('progress').style.display = 'none';
    const text = result.data.text;
    document.getElementById('result').textContent = 'Okunan: ' + text.replace(/\n/g,' ').trim().slice(0,200);
    const date = extractDate(text);
    const el = document.getElementById('date-found');
    el.style.display = 'block';
    if (date) {
      el.style.background = '#eaf4ee'; el.style.color = '#2e7d52';
      el.textContent = '✅ SKT: ' + date;
    } else {
      el.style.background = '#faecec'; el.style.color = '#b52b2b';
      el.textContent = '⚠️ Tarih bulunamadı — daha dar alan seçin';
    }
  } catch(e) {
    document.getElementById('result').textContent = '❌ ' + e.message;
  }
}

function extractDate(text) {
  const t = text.toUpperCase().replace(/O/g,'0').replace(/[Il]/g,'1');
  const patterns = [
    /(?:SKT|SON\s*KUL|TETT|EXP|BEST\s*BY|USE\s*BY|BB|MHD)[:\s.]*(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/i,
    /(?:SKT|SON\s*KUL|TETT|EXP|BEST\s*BY|USE\s*BY|BB|MHD)[:\s.]*(\d{1,2})[.\/-](\d{4})/i,
    /(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2})/,
    /(\d{1,2})[.\/-](20\d{2})/,
    /(20\d{2})-(\d{2})-(\d{2})/,
  ];
  const mMap={OCA:1,ŞUB:2,MAR:3,NİS:4,MAY:5,HAZ:6,TEM:7,AĞU:8,EYL:9,EKİ:10,KAS:11,ARA:12,JAN:1,FEB:2,APR:4,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  for (const pat of patterns) {
    const m = t.match(pat);
    if (!m) continue;
    try {
      const g = m.slice(1).filter(Boolean);
      let day, month, year;
      if (g.length === 2) {
        month = parseInt(g[0]); year = parseInt(g[1]);
        if (year < 100) year += 2000;
        if (month < 1 || month > 12) continue;
        return year+'-'+String(month).padStart(2,'0')+'-28';
      } else if (g.length === 3) {
        if (isNaN(parseInt(g[1]))) { day=parseInt(g[0]); month=mMap[g[1].slice(0,3)]||1; year=parseInt(g[2]); }
        else if (g[0].length===4) { year=parseInt(g[0]); month=parseInt(g[1]); day=parseInt(g[2]); }
        else { day=parseInt(g[0]); month=parseInt(g[1]); year=parseInt(g[2]); }
        if (year < 100) year += 2000;
        if (month > 12 && day <= 12) [day,month]=[month,day];
        if (day<1||day>31||month<1||month>12||year<2024||year>2040) continue;
        return year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      }
    } catch {}
  }
  return null;
}
</script>
</body>
</html>

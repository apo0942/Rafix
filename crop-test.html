<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kırp & Oku Test</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f2eb;padding:1.5rem;max-width:500px;margin:0 auto}
h1{font-size:20px;margin-bottom:1rem;color:#1a1712}
.tabs{display:flex;background:#e8e4db;border-radius:10px;padding:3px;margin-bottom:1rem;gap:3px}
.tab{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:none;color:#7a7570;font-family:system-ui}
.tab.active{background:#fff;color:#1a1712}
#result{padding:1rem;background:#fff;border-radius:12px;border:1.5px solid #e0ddd5;min-height:50px;font-size:13px;color:#1a1712;line-height:1.6;margin-bottom:10px;white-space:pre-wrap}
#found{padding:1rem;background:#eaf4ee;border-radius:12px;font-size:15px;font-weight:600;color:#2e7d52;display:none;margin-bottom:10px;text-align:center;white-space:pre-wrap}
.btn{display:block;width:100%;padding:12px;background:#c85a2a;color:#fff;border:none;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;font-family:system-ui;text-align:center}
.btn.green{background:#2e7d52}.btn.gray{background:#7a7570}
label.btn{display:block}
input[type=file]{display:none}
#crop-wrap{display:none;margin-bottom:10px}
#crop-hint{font-size:12px;color:#7a7570;text-align:center;margin-bottom:8px;padding:6px;background:#fff;border-radius:8px}
#crop-container{position:relative;-webkit-user-select:none;user-select:none}
#crop-canvas{display:block;width:100%;border-radius:12px;border:1.5px solid #e0ddd5;touch-action:none;-webkit-touch-callout:none}
#crop-box{position:absolute;border:2.5px solid #c85a2a;background:rgba(200,90,42,0.15);pointer-events:none;display:none;top:0;left:0}
progress{width:100%;height:6px;border-radius:10px;display:none;margin-bottom:10px;accent-color:#c85a2a}
#preview-strip{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto}
#preview-strip img{height:50px;border-radius:4px;border:1px solid #e0ddd5;flex-shrink:0}
</style>
</head>
<body>
<h1>✂️ Kırp & Oku Test</h1>
<div class="tabs">
  <button class="tab active" onclick="setMode('barcode',this)">📷 Barkod</button>
  <button class="tab" onclick="setMode('skt',this)">📅 SKT</button>
</div>
<div style="display:flex;gap:8px;margin-bottom:10px">
  <label class="btn" for="file-input" style="flex:1;margin:0">📷 Kamera</label>
  <label class="btn" for="gallery-input" style="flex:1;margin:0;background:#7a7570">🖼️ Galeri</label>
</div>
<input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFile(event)">
<input type="file" id="gallery-input" accept="image/*" onchange="handleFile(event)">

<div id="crop-wrap">
  <div id="crop-hint"></div>
  <div id="crop-container">
    <canvas id="crop-canvas"></canvas>
    <div id="crop-box"></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn green" onclick="doCrop()" style="flex:1;margin:0">✂️ Kırp ve Oku</button>
    <button class="btn gray" onclick="resetCrop()" style="flex:1;margin:0">↺ Sıfırla</button>
  </div>
</div>

<progress id="progress" max="100"></progress>
<div id="preview-strip"></div>
<div id="result">Fotoğraf seçin…</div>
<div id="found"></div>
<div id="__scan_tmp__" style="display:none"></div>

<script>
let mode = 'barcode';
let origImage = null;
// Seçim koordinatları: canvas piksel cinsinden (görüntülenen canvas CSS px)
let cropStart = null, cropEnd = null, isDragging = false;

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('result').textContent = 'Fotoğraf seçin…';
  document.getElementById('found').style.display = 'none';
  document.getElementById('crop-wrap').style.display = 'none';
  document.getElementById('preview-strip').innerHTML = '';
  cropStart = null; cropEnd = null;
}

async function handleFile(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;

  document.getElementById('result').textContent = '⏳ Yükleniyor…';

  const url = URL.createObjectURL(file);
  origImage = new Image();
  origImage.onload = () => {
    URL.revokeObjectURL(url);
    drawToCanvas();
    document.getElementById('crop-hint').textContent =
      mode === 'barcode' ? '👆 Barkodun etrafını parmağınla çiz' : '👆 SKT yazısının etrafını parmağınla çiz';
    document.getElementById('crop-wrap').style.display = '';
    document.getElementById('result').textContent = 'Alanı çiz → Kırp ve Oku';
    document.getElementById('found').style.display = 'none';
    document.getElementById('preview-strip').innerHTML = '';
    cropStart = null; cropEnd = null;
    document.getElementById('crop-box').style.display = 'none';
    attachListeners();
    document.getElementById('crop-wrap').scrollIntoView({ behavior: 'smooth' });
  };
  origImage.onerror = () => { document.getElementById('result').textContent = '❌ Görüntü yüklenemedi'; };
  origImage.src = url;
}

function drawToCanvas() {
  const canvas = document.getElementById('crop-canvas');
  const maxW = Math.min(window.innerWidth - 48, 480);
  // Canvas CSS genişliğini ayarla, height oransal olur
  const ratio = origImage.height / origImage.width;
  canvas.style.width = maxW + 'px';
  canvas.style.height = Math.round(maxW * ratio) + 'px';
  // Canvas piksel boyutu = gerçek görüntü boyutu (1:1 çizim kalitesi için)
  canvas.width = origImage.width;
  canvas.height = origImage.height;
  canvas.getContext('2d').drawImage(origImage, 0, 0);
}

// ── Koordinat hesaplama ──────────────────────────────────────────
// Döndürülen değer: canvas'ın CSS px cinsinden (crop-box'ı pozisyonlamak için)
function getCSS(e) {
  const canvas = document.getElementById('crop-canvas');
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: Math.max(0, Math.min(src.clientX - rect.left, rect.width)),
    y: Math.max(0, Math.min(src.clientY - rect.top,  rect.height))
  };
}

function attachListeners() {
  const canvas = document.getElementById('crop-canvas');
  // Eski listener'ları temizle (yeni fotoğrafta tekrar eklenmesin)
  canvas.replaceWith(canvas.cloneNode(true));
  const c = document.getElementById('crop-canvas');

  c.addEventListener('mousedown',  onDown);
  c.addEventListener('mousemove',  onMove);
  c.addEventListener('mouseup',    onUp);
  c.addEventListener('mouseleave', onUp);
  c.addEventListener('touchstart', onDown, { passive: false });
  c.addEventListener('touchmove',  onMove, { passive: false });
  c.addEventListener('touchend',   onUp,   { passive: false });
}

function onDown(e) {
  e.preventDefault();
  isDragging = true;
  cropStart = getCSS(e);
  cropEnd = { ...cropStart };
  updateBox();
}
function onMove(e) {
  e.preventDefault();
  if (!isDragging) return;
  cropEnd = getCSS(e);
  updateBox();
}
function onUp(e) {
  e.preventDefault();
  isDragging = false;
}

function updateBox() {
  if (!cropStart || !cropEnd) return;
  const box = document.getElementById('crop-box');
  const x = Math.min(cropStart.x, cropEnd.x);
  const y = Math.min(cropStart.y, cropEnd.y);
  const w = Math.abs(cropEnd.x - cropStart.x);
  const h = Math.abs(cropEnd.y - cropStart.y);
  box.style.display = 'block';
  box.style.left   = x + 'px';
  box.style.top    = y + 'px';
  box.style.width  = w + 'px';
  box.style.height = h + 'px';
}

function resetCrop() {
  cropStart = null; cropEnd = null;
  document.getElementById('crop-box').style.display = 'none';
  document.getElementById('result').textContent = 'Alanı çiz → Kırp ve Oku';
}

// ── Kırpma ───────────────────────────────────────────────────────
async function doCrop() {
  if (!cropStart || !cropEnd || !origImage) { alert('Önce alan seçin!'); return; }

  const canvas = document.getElementById('crop-canvas');
  const rect   = canvas.getBoundingClientRect();

  // CSS px → orijinal görüntü px dönüşüm oranı
  const scaleX = origImage.width  / rect.width;
  const scaleY = origImage.height / rect.height;

  const cssX = Math.min(cropStart.x, cropEnd.x);
  const cssY = Math.min(cropStart.y, cropEnd.y);
  const cssW = Math.abs(cropEnd.x - cropStart.x);
  const cssH = Math.abs(cropEnd.y - cropStart.y);

  if (cssW < 20 || cssH < 8) { alert('Daha büyük alan seçin!'); return; }

  // Orijinal görüntüdeki koordinatlara çevir
  const ox = cssX * scaleX;
  const oy = cssY * scaleY;
  const ow = cssW * scaleX;
  const oh = cssH * scaleY;

  if (mode === 'barcode') await readBarcode(ox, oy, ow, oh);
  else                    await readSKT(ox, oy, ow, oh);
}

// ── Barkod okuma ─────────────────────────────────────────────────
async function readBarcode(x, y, w, h) {
  document.getElementById('result').textContent = '🔍 4 açı deneniyor…';
  document.getElementById('progress').style.display = 'block';
  document.getElementById('found').style.display = 'none';
  document.getElementById('preview-strip').innerHTML = '';

  const angles = [0, 90, 180, 270];
  for (const angle of angles) {
    const cropped = cropRotated(x, y, w, h, angle, 2);
    const img = document.createElement('img');
    img.src = cropped.toDataURL('image/jpeg', 0.9);
    document.getElementById('preview-strip').appendChild(img);

    document.getElementById('result').textContent = `🔄 ${angle}° deneniyor…`;
    const code = await scanCanvasForBarcode(cropped);
    if (code) {
      document.getElementById('progress').style.display = 'none';
      document.getElementById('result').textContent = `✅ Barkod (${angle}°): ${code}`;
      await lookupProduct(code);
      return;
    }
  }
  document.getElementById('progress').style.display = 'none';
  document.getElementById('result').textContent = '⚠️ Barkod okunamadı.\nİpuçları:\n• Sadece barkod çizgilerini seçin\n• Yeterince yakın çekin\n• Net fotoğraf kullanın';
}

async function scanCanvasForBarcode(canvas) {
  return new Promise((resolve) => {
    const timer = setTimeout(() => resolve(null), 5000);
    canvas.toBlob(blob => {
      const file = new File([blob], 'scan.jpg', { type: 'image/jpeg' });
      const scanner = new Html5Qrcode('__scan_tmp__', { verbose: false });
      scanner.scanFile(file, false)
        .then(code => { clearTimeout(timer); resolve(code); })
        .catch(() => { clearTimeout(timer); resolve(null); });
    }, 'image/jpeg', 0.95);
  });
}

// ── SKT okuma ────────────────────────────────────────────────────
async function readSKT(x, y, w, h) {
  document.getElementById('result').textContent = '⏳ SKT okunuyor…';
  document.getElementById('progress').style.display = 'block';
  document.getElementById('found').style.display = 'none';

  const canvas = cropRotated(x, y, w, h, 0, 3, true);
  const img = document.createElement('img');
  img.src = canvas.toDataURL();
  document.getElementById('preview-strip').innerHTML = '';
  document.getElementById('preview-strip').appendChild(img);

  try {
    const result = await Tesseract.recognize(canvas, 'tur+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          document.getElementById('progress').value = Math.round(m.progress * 100);
          document.getElementById('result').textContent = 'OCR: %' + Math.round(m.progress * 100);
        }
      }
    });
    document.getElementById('progress').style.display = 'none';
    const text = result.data.text;
    document.getElementById('result').textContent = 'Okunan: ' + text.replace(/\n/g,' ').trim().slice(0, 200);
    const date = extractDate(text);
    const el = document.getElementById('found');
    el.style.display = 'block';
    if (date) {
      el.style.background = '#eaf4ee'; el.style.color = '#2e7d52';
      el.textContent = '✅ SKT: ' + date;
    } else {
      el.style.background = '#faecec'; el.style.color = '#b52b2b';
      el.textContent = '⚠️ Tarih bulunamadı\nDaha dar alan seçin';
    }
  } catch(e) {
    document.getElementById('result').textContent = '❌ ' + e.message;
  }
}

// ── Yardımcı: kırp + döndür + büyüt ─────────────────────────────
function cropRotated(x, y, w, h, angle, factor = 2, contrast = false) {
  // 1. Orijinal görüntüden kırp
  const tmp = document.createElement('canvas');
  tmp.width = Math.round(w); tmp.height = Math.round(h);
  tmp.getContext('2d').drawImage(origImage, x, y, w, h, 0, 0, tmp.width, tmp.height);

  const rad = angle * Math.PI / 180;
  const out = document.createElement('canvas');
  if (angle === 90 || angle === 270) {
    out.width  = Math.round(h * factor);
    out.height = Math.round(w * factor);
  } else {
    out.width  = Math.round(w * factor);
    out.height = Math.round(h * factor);
  }

  const ctx = out.getContext('2d');
  ctx.translate(out.width / 2, out.height / 2);
  ctx.rotate(rad);
  if (angle === 90 || angle === 270) {
    ctx.drawImage(tmp, -h * factor / 2, -w * factor / 2, h * factor, w * factor);
  } else {
    ctx.drawImage(tmp, -w * factor / 2, -h * factor / 2, w * factor, h * factor);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  if (contrast) {
    const id = ctx.getImageData(0, 0, out.width, out.height);
    const d  = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const g = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      const v = Math.min(255, Math.max(0, (g - 128) * 2 + 128));
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(id, 0, 0);
  }
  return out;
}

// ── Ürün arama ───────────────────────────────────────────────────
async function lookupProduct(code) {
  const el = document.getElementById('found');
  el.style.display = 'block';
  el.style.background = '#eaf4ee'; el.style.color = '#2e7d52';
  el.textContent = '🔍 Ürün aranıyor…';
  try {
    const res  = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
    const data = await res.json();
    if (data.status === 1) {
      const p = data.product;
      const name  = p.product_name_tr || p.product_name || 'Ad yok';
      const brand = (p.brands || '').split(',')[0].trim();
      el.textContent = `✅ ${name}${brand ? ' · ' + brand : ''}\nBarkod: ${code}`;
    } else {
      el.textContent = `⚠️ Barkod okundu: ${code}\nVeri tabanında yok`;
    }
  } catch {
    el.textContent = `✅ Barkod: ${code}\n❌ Ürün aranamadı`;
  }
}

// ── Tarih çıkarma ────────────────────────────────────────────────
function extractDate(text) {
  const t = text.toUpperCase().replace(/O/g, '0').replace(/[Il]/g, '1');
  const patterns = [
    /(?:SKT|SON\s*KUL|TETT|EXP|BEST\s*BY|USE\s*BY|BB|MHD)[:\s.]*(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/i,
    /(?:SKT|SON\s*KUL|TETT|EXP|BEST\s*BY|USE\s*BY|BB|MHD)[:\s.]*(\d{1,2})[.\/-](\d{4})/i,
    /(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2})/,
    /(\d{1,2})[.\/-](20\d{2})/,
    /(20\d{2})-(\d{2})-(\d{2})/,
  ];
  const mMap = {OCA:1,ŞUB:2,MAR:3,NİS:4,MAY:5,HAZ:6,TEM:7,AĞU:8,EYL:9,EKİ:10,KAS:11,ARA:12,JAN:1,FEB:2,APR:4,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  for (const pat of patterns) {
    const m = t.match(pat);
    if (!m) continue;
    try {
      const g = m.slice(1).filter(Boolean);
      let day, month, year;
      if (g.length === 2) {
        month = parseInt(g[0]); year = parseInt(g[1]);
        if (year < 100) year += 2000;
        if (month < 1 || month > 12) continue;
        return year + '-' + String(month).padStart(2, '0') + '-28';
      } else if (g.length === 3) {
        if (isNaN(parseInt(g[1]))) { day = parseInt(g[0]); month = mMap[g[1].slice(0,3)] || 1; year = parseInt(g[2]); }
        else if (g[0].length === 4) { year = parseInt(g[0]); month = parseInt(g[1]); day = parseInt(g[2]); }
        else { day = parseInt(g[0]); month = parseInt(g[1]); year = parseInt(g[2]); }
        if (year < 100) year += 2000;
        if (month > 12 && day <= 12) [day, month] = [month, day];
        if (day<1||day>31||month<1||month>12||year<2024||year>2040) continue;
        return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      }
    } catch {}
  }
  return null;
}
</script>
</body>
</html>

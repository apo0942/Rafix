<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafix - Barkod Tarama</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --accent: #C85A2A; --cream: #F7F4EF; --dark: #1C1916; }
        body { font-family: 'DM Sans', sans-serif; background: var(--cream); padding: 20px; max-width: 500px; margin: 0 auto; color: var(--dark); }
        #reader { border-radius: 15px; overflow: hidden; border: 2px solid var(--accent); background: #fff; }
        .info-card { background: #fff; padding: 15px; border-radius: 12px; margin-top: 20px; border: 1.5px solid #E6E2D9; display: none; }
        .btn { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        h1 { font-size: 24px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Barkod Tara</h1>
    <div id="reader"></div>
    
    <div id="product-card" class="info-card">
        <h3 id="p-name">Ürün Adı</h3>
        <p id="p-brand" style="color: #8C8880;">Marka</p>
        <button class="btn" onclick="goToSKT()">Son Kullanma Tarihini Oku</button>
    </div>

    <script>
        let scannedBarcode = "";
        let productName = "";

        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 150 } };

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);

        async function onScanSuccess(decodedText) {
            scannedBarcode = decodedText;
            document.getElementById('product-card').style.display = 'block';
            document.getElementById('p-name').textContent = "🔍 Arıyor...";
            
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`);
                const data = await res.json();
                if (data.status === 1) {
                    productName = data.product.product_name_tr || data.product.product_name || "Bilinmeyen Ürün";
                    document.getElementById('p-name').textContent = productName;
                    document.getElementById('p-brand').textContent = data.product.brands || "";
                } else {
                    document.getElementById('p-name').textContent = "Ürün bulunamadı, manuel girin.";
                }
            } catch (e) {
                console.error("Hata:", e);
            }
            html5QrCode.stop();
        }

        function goToSKT() {
            // Verileri diğer sayfaya aktarmak için (Basitlik adına localStorage kullanıyoruz)
            localStorage.setItem('last_barcode', scannedBarcode);
            localStorage.setItem('last_name', productName);
            window.location.href = 'skt_oku.html';
        }
    </script>
</body>
</html>

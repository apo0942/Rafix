<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKT Okuma Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f2eb;padding:1.5rem;max-width:500px;margin:0 auto}
h1{font-size:22px;margin-bottom:1rem;color:#1a1712}
img#preview{width:100%;border-radius:12px;margin-bottom:1rem;display:none}
#result{padding:1rem;background:#fff;border-radius:12px;border:1.5px solid #e0ddd5;min-height:60px;font-size:14px;color:#1a1712;line-height:1.6;margin-bottom:10px}
#date-found{padding:1rem;background:#eaf4ee;border-radius:12px;border:1.5px solid #c4dfc9;font-size:16px;font-weight:600;color:#2e7d52;display:none;margin-bottom:10px}
label{display:block;width:100%;padding:12px;background:#c85a2a;color:#fff;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;margin-bottom:10px}
input[type=file]{display:none}
progress{width:100%;height:6px;border-radius:10px;display:none;margin-bottom:10px}
</style>
</head>
<body>
<h1>🔍 SKT Okuma Test</h1>

<label for="file-input">📸 Fotoğraf Seç</label>
<input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFile(event)">
<progress id="progress" max="100"></progress>
<img id="preview">
<div id="result">Fotoğraf seçin…</div>
<div id="date-found"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
async function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Önizleme
  const url = URL.createObjectURL(file);
  const preview = document.getElementById('preview');
  preview.src = url;
  preview.style.display = 'block';

  document.getElementById('result').textContent = '⏳ Okunuyor… (15-30 saniye)';
  document.getElementById('date-found').style.display = 'none';
  document.getElementById('progress').style.display = 'block';

  try {
    // Görüntüyü sıkıştır
    const img = new Image();
    img.src = url;
    await new Promise(r => img.onload = r);
    const canvas = document.createElement('canvas');
    const max = 1200;
    let w = img.width, h = img.height;
    if (w > max || h > max) {
      if (w > h) { h = Math.round(h * max / w); w = max; }
      else { w = Math.round(w * max / h); h = max; }
    }
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    // Kontrastı artır
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      const v = Math.min(255, Math.max(0, (gray - 128) * 1.5 + 128));
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(imgData, 0, 0);

    // Tesseract OCR
    const result = await Tesseract.recognize(canvas, 'tur+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          document.getElementById('progress').value = Math.round(m.progress * 100);
          document.getElementById('result').textContent = `OCR: %${Math.round(m.progress * 100)}`;
        }
      }
    });

    const text = result.data.text;
    document.getElementById('progress').style.display = 'none';
    document.getElementById('result').textContent = 'Okunan metin:\n' + text.slice(0, 300);

    // Tarih çıkar
    const date = extractDate(text);
    const dateEl = document.getElementById('date-found');
    if (date) {
      dateEl.style.display = 'block';
      dateEl.textContent = '✅ Bulunan SKT: ' + date;
    } else {
      dateEl.style.display = 'block';
      dateEl.style.background = '#faecec';
      dateEl.style.borderColor = '#f0c4c4';
      dateEl.style.color = '#b52b2b';
      dateEl.textContent = '⚠️ Tarih bulunamadı';
    }
  } catch(e) {
    document.getElementById('result').textContent = '❌ Hata: ' + e.message;
  }
}

function extractDate(text) {
  const t = text.toUpperCase();
  const patterns = [
    /(?:SKT|SON KUL|S\.K\.T|EXP|BEST BY|USE BY|BB|TETT|MHD)[:\s.]*(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/i,
    /(?:SKT|SON KUL|S\.K\.T|EXP|BEST BY|USE BY|BB|TETT|MHD)[:\s.]*(\d{1,2})[.\/-](\d{4})/i,
    /(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2})/,
    /(\d{1,2})[.\/-](20\d{2})/,
    /(20\d{2})-(\d{2})-(\d{2})/,
    /(\d{1,2})\s*(OCA|ŞUB|MAR|NİS|MAY|HAZ|TEM|AĞU|EYL|EKİ|KAS|ARA|JAN|FEB|APR|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\w*\s*(20\d{2})/i,
  ];
  const monthMap = {OCA:1,ŞUB:2,MAR:3,NİS:4,MAY:5,HAZ:6,TEM:7,AĞU:8,EYL:9,EKİ:10,KAS:11,ARA:12,JAN:1,FEB:2,APR:4,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};

  for (const pat of patterns) {
    const m = t.match(pat);
    if (!m) continue;
    try {
      const g = m.slice(1).filter(Boolean);
      let day, month, year;
      if (g.length === 2) {
        if (g[1].length === 4) { month = parseInt(g[0]); year = parseInt(g[1]); }
        else { year = parseInt(g[0]); month = parseInt(g[1]); }
        if (month < 1 || month > 12) continue;
        return `${year}-${String(month).padStart(2,'0')}-28`;
      } else if (g.length === 3) {
        if (isNaN(parseInt(g[1]))) {
          day = parseInt(g[0]); month = monthMap[g[1].slice(0,3)] || 1; year = parseInt(g[2]);
        } else if (g[0].length === 4) {
          year = parseInt(g[0]); month = parseInt(g[1]); day = parseInt(g[2]);
        } else {
          day = parseInt(g[0]); month = parseInt(g[1]); year = parseInt(g[2]);
        }
        if (year < 100) year += 2000;
        if (month > 12 && day <= 12) [day, month] = [month, day];
        if (day < 1 || day > 31 || month < 1 || month > 12 || year < 2024 || year > 2040) continue;
        return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      }
    } catch {}
  }
  return null;
}
</script>
</body>
</html>

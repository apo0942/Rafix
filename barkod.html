<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rafix - Gelişmiş SKT</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

<style>
  :root {
    --cream: #F7F4EF; --dark: #1C1916; --muted: #8C8880; 
    --border: #E6E2D9; --white: #FFFFFF; --accent: #C85A2A; 
    --ok: #2E7D52; --ok-bg: #EAF4EE;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); padding: 20px; padding-bottom: 100px; }
  h1 { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 32px; margin-bottom: 20px; }

  .product-card { 
    background: var(--white); padding: 15px; border-radius: 16px; 
    margin-bottom: 12px; border: 1.5px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

  /* Modal Yapısı */
  .modal-overlay { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.9); display: none; z-index: 1000; 
    flex-direction: column; justify-content: center; padding: 20px;
  }
  .modal-box { background: var(--white); border-radius: 24px; padding: 20px; width: 100%; max-width: 450px; margin: auto; }
  
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  .crop-wrapper { width: 100%; max-height: 400px; background: #000; border-radius: 12px; overflow: hidden; margin: 15px 0; }
  #image-to-crop { display: block; max-width: 100%; }

  .btn { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 40px; font-weight: 600; font-size: 16px; cursor: pointer; }
  .btn-add { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 400px; box-shadow: 0 10px 20px rgba(200,90,42,0.3); }
  
  .loader { display: none; text-align: center; color: var(--accent); font-weight: bold; margin: 10px; }
</style>
</head>
<body>

<h1>Rafix</h1>
<div id="product-list">
    <p id="empty-msg" style="text-align: center; color: var(--muted); margin-top: 50px;">Dolabınız şu an boş.</p>
</div>

<button class="btn btn-add" onclick="initScan()">+ Ürün Ekle</button>

<div class="modal-overlay" id="flow-modal">
  <div class="modal-box">
    <h2 id="modal-status" style="font-family: 'Playfair Display'; margin-bottom: 15px;">Barkod Okutun</h2>
    
    <div id="step-barcode">
      <div id="reader"></div>
      <button class="btn" style="background:#666; margin-top:15px;" onclick="closeFlow()">İptal</button>
    </div>

    <div id="step-crop" style="display: none;">
      <div class="crop-wrapper">
        <img id="image-to-crop">
      </div>
      <p style="font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 10px;">Sadece tarih yazan yeri kutu içine al.</p>
      <button class="btn" onclick="processFinalDate()">✂️ Tarihi Çöz ve Kaydet</button>
    </div>

    <div id="loading-spinner" class="loader">Veriler işleniyor...</div>
    <input type="file" id="camera-capture" accept="image/*" capture="environment" style="display: none;">
  </div>
</div>

<script>
let qrScanner;
let imageCropper;
let activeItem = { barcode: "", name: "", date: "" };

// Senin dosyadaki gelişmiş tarih mantığı
const months = {
  OCA:1,ŞUB:2,MAR:3,NİS:4,MAY:5,HAZ:6,TEM:7,AĞU:8,EYL:9,EKİ:10,KAS:11,ARA:12,
  JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12
};

const dateRegexes = [
  /(\d{2})[.\/-](\d{2})[.\/-](\d{2,4})/,
  /(\d{1,2})\s*(OCA|ŞUB|MAR|NİS|MAY|HAZ|TEM|AĞU|EYL|EKİ|KAS|ARA|JAN|FEB|APR|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\w*\s*(20\d{2})/i
];

function initScan() {
  document.getElementById('flow-modal').style.display = 'flex';
  document.getElementById('step-barcode').style.display = 'block';
  document.getElementById('step-crop').style.display = 'none';
  
  qrScanner = new Html5Qrcode("reader");
  qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onBarcodeDetected);
}

async function onBarcodeDetected(code) {
  await qrScanner.stop();
  activeItem.barcode = code;
  
  document.getElementById('step-barcode').style.display = 'none';
  document.getElementById('loading-spinner').style.display = 'block';
  document.getElementById('modal-status').innerText = "Ürün Bilgisi Alınıyor...";

  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
    const data = await res.json();
    activeItem.name = (data.status === 1) ? (data.product.product_name_tr || data.product.product_name) : "Tanımlanamayan Ürün";
  } catch { activeItem.name = "Tanımlanamayan Ürün"; }

  document.getElementById('loading-spinner').style.display = 'none';
  document.getElementById('modal-status').innerText = "Tarihi Fotoğrafla";
  document.getElementById('camera-capture').click();
}

document.getElementById('camera-capture').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    document.getElementById('step-crop').style.display = 'block';
    const imgElement = document.getElementById('image-to-crop');
    imgElement.src = event.target.result;
    
    if (imageCropper) imageCropper.destroy();
    imageCropper = new Cropper(imgElement, { viewMode: 1, autoCropArea: 0.6 });
    document.getElementById('modal-status').innerText = "Tarih Alanını Kırp";
  };
  reader.readAsDataURL(file);
};

async function processFinalDate() {
  document.getElementById('loading-spinner').style.display = 'block';
  const canvas = imageCropper.getCroppedCanvas({ width: 800 });
  const base64Img = canvas.toDataURL('image/jpeg');

  try {
    const ocrResult = await Tesseract.recognize(base64Img, 'eng+tur');
    const scannedText = ocrResult.data.text;
    
    // Gelişmiş Tarih Yakalama
    let dateFound = null;
    for (const regex of dateRegexes) {
      const match = scannedText.match(regex);
      if (match) {
        dateFound = match[0];
        break;
      }
    }

    if (dateFound) {
      activeItem.date = dateFound;
      renderNewProduct();
      closeFlow();
    } else {
      alert("Tarih bulunamadı. Lütfen sadece tarih yazan kısmı daha net kırpın.");
    }
  } catch (err) { alert("OCR Hatası: " + err.message); }
  document.getElementById('loading-spinner').style.display = 'none';
}

function renderNewProduct() {
  document.getElementById('empty-msg').style.display = 'none';
  const list = document.getElementById('product-list');
  const html = `
    <div class="product-card">
      <div>
        <strong style="display:block; margin-bottom:4px;">${activeItem.name}</strong>
        <span style="font-size:12px; color:var(--muted)">${activeItem.barcode}</span>
      </div>
      <div style="background:var(--ok-bg); color:var(--ok); padding:6px 14px; border-radius:20px; font-weight:700; font-size:14px;">
        ${activeItem.date}
      </div>
    </div>
  `;
  list.insertAdjacentHTML('afterbegin', html);
}

function closeFlow() {
  if (qrScanner) try { qrScanner.stop(); } catch(e) {}
  document.getElementById('flow-modal').style.display = 'none';
}
</script>
</body>
</html>

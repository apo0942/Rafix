<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rafix - Akıllı SKT Takibi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

<style>
  :root {
    --cream: #F7F4EF; --dark: #1C1916; --mid: #3A3630;
    --muted: #8C8880; --border: #E6E2D9; --white: #FFFFFF;
    --accent: #C85A2A; --accent-light: #F5EAE3;
    --ok: #2E7D52; --ok-bg: #EAF4EE;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); line-height: 1.6; padding-bottom: 80px; }
  h1, h2, h3 { font-family: 'Playfair Display', serif; }
  
  /* Ana Konteyner */
  .container { max-width: 500px; margin: 0 auto; padding: 20px; }
  
  /* Başlık */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 28px; color: var(--accent); }
  
  /* Butonlar */
  .btn { width: 100%; padding: 16px; background: var(--accent); color: var(--white); border: none; border-radius: 40px; font-weight: 600; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
  .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.6; pointer-events: none; }
  
  /* Ürün Listesi */
  .product-card { background: var(--white); padding: 15px; border-radius: 16px; margin-bottom: 12px; border: 1.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .product-info h3 { font-size: 16px; margin-bottom: 4px; font-family: 'DM Sans', sans-serif; }
  .product-info p { font-size: 13px; color: var(--muted); }
  .skt-badge { background: var(--ok-bg); color: var(--ok); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }

  /* Modallar (Ekranlar) */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(28,25,22,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
  .modal { background: var(--white); width: 100%; max-width: 400px; border-radius: 24px; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 20px; margin-bottom: 15px; font-family: 'Playfair Display', serif; text-align: center; }
  
  /* Tarayıcı ve Kırpma Alanları */
  #reader { border-radius: 16px; overflow: hidden; margin-bottom: 15px; }
  .crop-container { width: 100%; max-height: 350px; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 15px; }
  img { max-width: 100%; display: block; }
  
  /* Yükleniyor Göstergesi */
  .loader { text-align: center; color: var(--accent); font-weight: 600; margin: 15px 0; display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Rafix</h1>
    <p style="color: var(--muted); font-weight: 500;">Dolabım</p>
  </div>

  <div id="product-list">
    <div class="product-card">
      <div class="product-info">
        <h3>Örnek Süt</h3>
        <p>Barkod: 869123456789</p>
      </div>
      <div class="skt-badge">12.10.2024</div>
    </div>
  </div>

  <button class="btn" onclick="startBarcodeScan()" style="position: fixed; bottom: 20px; width: calc(100% - 40px); max-width: 460px; box-shadow: 0 4px 15px rgba(200,90,42,0.3);">
    + Yeni Ürün Ekle
  </button>
</div>

<div class="modal-overlay" id="barcode-modal">
  <div class="modal">
    <h2 class="modal-title">Barkodu Okutun</h2>
    <div id="reader"></div>
    <div id="barcode-loader" class="loader">Ürün Aranıyor...</div>
    <button class="btn btn-outline" onclick="closeModal('barcode-modal')">İptal</button>
  </div>
</div>

<div class="modal-overlay" id="crop-modal">
  <div class="modal">
    <h2 class="modal-title">Tarih Alanını Kırpın</h2>
    <p style="text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 15px;" id="scanned-product-name">Ürün Adı</p>
    
    <div class="crop-container">
      <img id="image-to-crop">
    </div>
    
    <div id="ocr-loader" class="loader">Tarih Okunuyor...</div>
    
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
    
    <button class="btn btn-outline" onclick="document.getElementById('camera-input').click()" style="margin-bottom: 10px;">📸 Yeniden Çek</button>
    <button class="btn" id="crop-btn" onclick="applyCropAndScan()">✂️ Tarihi Oku</button>
  </div>
</div>

<script>
  // --- GLOBAL DEĞİŞKENLER ---
  let html5QrCode;
  let cropperInstance;
  let currentProduct = { name: "", barcode: "", date: "" };

  // --- MODAL YÖNETİMİ ---
  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  // --- 1. ADIM: BARKOD OKUMA ---
  function startBarcodeScan() {
    openModal('barcode-modal');
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, 
      async (decodedText) => {
        // Barkod okundu!
        html5QrCode.stop();
        document.getElementById('reader').style.display = 'none';
        document.getElementById('barcode-loader').style.display = 'block';
        
        currentProduct.barcode = decodedText;
        
        // OpenFoodFacts API ile ürün adını bul
        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`);
          const data = await res.json();
          currentProduct.name = (data.status === 1) ? (data.product.product_name_tr || data.product.product_name) : "Bilinmeyen Ürün";
        } catch (e) {
          currentProduct.name = "Bilinmeyen Ürün";
        }
        
        document.getElementById('barcode-loader').style.display = 'none';
        document.getElementById('reader').style.display = 'block';
        closeModal('barcode-modal');
        
        // 2. Adıma Geç (Fotoğraf Çekimi)
        startSktCapture();
      }
    );
  }

  // --- 2. ADIM: FOTOĞRAF ÇEKİMİ VE KIRPMA EKRANINI HAZIRLAMA ---
  function startSktCapture() {
    document.getElementById('scanned-product-name').textContent = `${currentProduct.name} - ${currentProduct.barcode}`;
    openModal('crop-modal');
    // Otomatik olarak kamerayı aç
    document.getElementById('camera-input').click();
  }

  // Kullanıcı fotoğraf çektiğinde Cropper'ı başlat
  document.getElementById('camera-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const imgElement = document.getElementById('image-to-crop');
      imgElement.src = event.target.result;
      
      if (cropperInstance) cropperInstance.destroy();
      
      // Cropper başlatılıyor...
      cropperInstance = new Cropper(imgElement, {
        viewMode: 1,
        autoCropArea: 0.5,
        responsive: true,
        background: false
      });
    };
    reader.readAsDataURL(file);
  });

  // --- 3. ADIM: KIRPMA VE OCR (TESSERACT) ---
  async function applyCropAndScan() {
    if (!cropperInstance) return alert("Lütfen önce bir fotoğraf çekin.");
    
    document.getElementById('crop-btn').style.display = 'none';
    document.getElementById('ocr-loader').style.display = 'block';

    // Seçili alanı al
    const canvas = cropperInstance.getCroppedCanvas({ width: 600 });
    const base64Image = canvas.toDataURL('image/jpeg');

    try {
      // Tesseract ile metni oku
      const result = await Tesseract.recognize(base64Image, 'eng+tur');
      const text = result.data.text;
      
      // Metin içinden tarihi ayıkla (Senin önceki kodundaki regex mantığı)
      const dateStr = extractDateFromText(text);
      
      if(dateStr) {
        currentProduct.date = dateStr;
        addProductToList();
        closeModal('crop-modal');
      } else {
        alert("Tarih bulunamadı. Lütfen alanı daha net kırpın veya manuel girin.\nBulunan metin: " + text);
      }
    } catch (e) {
      alert("Okuma hatası: " + e.message);
    } finally {
      document.getElementById('crop-btn').style.display = 'flex';
      document.getElementById('ocr-loader').style.display = 'none';
    }
  }

  // Tarih Çıkarıcı Fonksiyon
  function extractDateFromText(t) {
    const patterns = [
      /(\d{2})[.\/](\d{2})[.\/](\d{2,4})/, // 12.10.2024
      /(\d{1,2})\s*(OCA|ŞUB|MAR|NİS|MAY|HAZ|TEM|AĞU|EYL|EKİ|KAS|ARA)\s*(20\d{2})/i // 12 Eyl 2024
    ];
    for (const pat of patterns) {
      const m = t.match(pat);
      if (m) return m[0]; // İlk eşleşen tarihi döndür
    }
    return null;
  }

  // --- 4. ADIM: LİSTEYE EKLEME ---
  function addProductToList() {
    const list = document.getElementById('product-list');
    const html = `
      <div class="product-card">
        <div class="product-info">
          <h3>${currentProduct.name}</h3>
          <p>Barkod: ${currentProduct.barcode}</p>
        </div>
        <div class="skt-badge">${currentProduct.date}</div>
      </div>
    `;
    // Yeni ürünü en üste ekle
    list.insertAdjacentHTML('afterbegin', html);
    alert(`${currentProduct.name} başarıyla eklendi!`);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kırp & Oku v6 - Akıllı Eşikleme</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0f2f5;padding:1rem;max-width:500px;margin:0 auto}
.card{background:#fff;padding:1rem;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:1rem}
h1{font-size:18px;margin-bottom:1rem;text-align:center}
#crop-container{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden;touch-action:none}
#crop-canvas{display:block;width:100%}
#crop-box{position:absolute;border:2px solid #00ff00;background:rgba(0,255,0,0.1);display:none;pointer-events:none}
.btn{display:block;width:100%;padding:14px;background:#007bff;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-scan{background:#28a745}
#preview-area{margin-top:10px;text-align:center}
#preview-area img{max-width:100%;border:2px solid #ddd;border-radius:8px;background:#f8f9fa}
#result-box{margin-top:10px;padding:12px;border-radius:12px;min-height:50px;font-weight:600;text-align:center}
.success{background:#d4edda;color:#155724}.error{background:#f8d7da;color:#721c24}
progress{width:100%;margin-top:10px;display:none}
</style>
</head>
<body>

<div class="card">
  <h1>📷 SKT Okuyucu v6</h1>
  <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)" style="display:none">
  <button class="btn" onclick="document.getElementById('file-input').click()">Fotoğraf Seç / Çek</button>

  <div id="crop-wrapper" style="display:none;margin-top:15px">
    <div id="crop-container">
      <canvas id="crop-canvas"></canvas>
      <div id="crop-box"></div>
    </div>
    <button class="btn btn-scan" onclick="processImage()">✂️ Kırp ve Analiz Et</button>
  </div>
</div>

<progress id="progress" max="100" value="0"></progress>

<div id="preview-area"></div>
<div id="result-box" style="display:none"></div>

<script>
let origImg = null;
let startX, startY, isDrawing = false;
let scale = 1;

function handleFile(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    origImg = new Image();
    origImg.onload = () => {
      const canvas = document.getElementById('crop-canvas');
      const containerW = document.getElementById('crop-container').clientWidth;
      scale = containerW / origImg.width;
      canvas.width = containerW;
      canvas.height = origImg.height * scale;
      canvas.getContext('2d').drawImage(origImg, 0, 0, canvas.width, canvas.height);
      document.getElementById('crop-wrapper').style.display = 'block';
      initCrop();
    };
    origImg.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

function initCrop() {
  const container = document.getElementById('crop-container');
  const box = document.getElementById('crop-box');
  
  const getPos = (e) => {
    const rect = container.getBoundingClientRect();
    const ev = e.touches ? e.touches[0] : e;
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  };

  container.onmousedown = container.ontouchstart = (e) => {
    isDrawing = true;
    const pos = getPos(e);
    startX = pos.x; startY = pos.y;
    box.style.display = 'block';
  };

  window.onmousemove = window.ontouchmove = (e) => {
    if(!isDrawing) return;
    const pos = getPos(e);
    box.style.left = Math.min(startX, pos.x) + 'px';
    box.style.top = Math.min(startY, pos.y) + 'px';
    box.style.width = Math.abs(pos.x - startX) + 'px';
    box.style.height = Math.abs(pos.y - startY) + 'px';
  };

  window.onmouseup = window.ontouchend = () => isDrawing = false;
}

async function processImage() {
  const box = document.getElementById('crop-box');
  const resultBox = document.getElementById('result-box');
  const prog = document.getElementById('progress');
  
  const x = parseInt(box.style.left) / scale;
  const y = parseInt(box.style.top) / scale;
  const w = parseInt(box.style.width) / scale;
  const h = parseInt(box.style.height) / scale;

  if(w < 20) return alert("Lütfen daha geniş bir alan seçin");

  prog.style.display = 'block';
  resultBox.style.display = 'none';

  // --- AKILLI GÖRÜNTÜ İŞLEME ---
  const canvas = document.createElement('canvas');
  canvas.width = w * 4; canvas.height = h * 4;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(origImg, x, y, w, h, 0, 0, canvas.width, canvas.height);

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;

  // 1. Adım: Ortalama Parlaklığı Bul (Dinamik Eşikleme için)
  let totalBrightness = 0;
  for(let i=0; i<data.length; i+=4) {
    totalBrightness += (data[i] + data[i+1] + data[i+2]) / 3;
  }
  const avg = totalBrightness / (data.length / 4);
  const threshold = avg * 0.85; // Ortalamanın %85'inden koyu olanları siyah yap (Yeşilleri eler)

  // 2. Adım: Filtrele
  for(let i=0; i<data.length; i+=4) {
    const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
    const val = brightness < threshold ? 0 : 255; 
    data[i] = data[i+1] = data[i+2] = val;
  }
  ctx.putImageData(imgData, 0, 0);

  // Önizlemeyi göster
  const previewArea = document.getElementById('preview-area');
  previewArea.innerHTML = '<b>İşlenen Görüntü:</b><br>';
  const img = new Image();
  img.src = canvas.toDataURL();
  previewArea.appendChild(img);

  try {
    const worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789./-',
      tessedit_pageseg_mode: '7',
    });

    const { data: { text } } = await worker.recognize(canvas);
    await worker.terminate();

    const cleanText = text.replace(/[^0-9./-]/g, '').trim();
    resultBox.style.display = 'block';
    
    if(cleanText.length >= 6) {
      resultBox.className = 'card success';
      resultBox.innerHTML = `Okunan: ${cleanText}<br>Tarih Başarılı!`;
    } else {
      resultBox.className = 'card error';
      resultBox.textContent = `Okunamadı: ${cleanText || 'Metin yok'}. Lütfen sadece rakamları içeren çok dar bir alan seçin.`;
    }
  } catch(e) {
    resultBox.style.display = 'block';
    resultBox.textContent = "Hata: " + e.message;
  }
  prog.style.display = 'none';
}
</script>
</body>
</html>

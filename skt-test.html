<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafix - SKT Okuma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        :root { --accent: #2E7D52; --cream: #F7F4EF; }
        body { font-family: sans-serif; background: var(--cream); padding: 20px; max-width: 500px; margin: 0 auto; text-align: center; }
        #image-container { width: 100%; background: #fff; border-radius: 12px; margin-bottom: 15px; overflow: hidden; min-height: 200px; }
        img { max-width: 100%; display: block; }
        .btn { width: 100%; padding: 15px; background: #C85A2A; color: #fff; border: none; border-radius: 40px; font-weight: 600; margin-top: 10px; }
        #result { margin-top: 20px; padding: 15px; background: #fff; border-radius: 12px; border: 2px solid var(--accent); display: none; }
        .loading { display: none; color: #C85A2A; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>
    <h2 id="product-display">Ürün Seçilmedi</h2>
    
    <div id="image-container">
        <img id="image-to-crop">
    </div>

    <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">
    <button class="btn" onclick="document.getElementById('file-input').click()">Fotoğraf Çek / Yükle</button>
    <button id="crop-btn" class="btn" style="display:none; background: var(--accent);">Seçili Alanı Tara</button>

    <div id="loader" class="loading">Tarih Okunuyor...</div>
    <div id="result">
        <p>Bulunan Tarih:</p>
        <h3 id="detected-date">-</h3>
    </div>

    <script>
        let cropper;
        const img = document.getElementById('image-to-crop');
        const cropBtn = document.getElementById('crop-btn');
        const loader = document.getElementById('loader');

        // Önceki sayfadan gelen ismi yaz
        document.getElementById('product-display').textContent = localStorage.getItem('last_name') || "Yeni Ürün";

        document.getElementById('file-input').onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                img.src = event.target.result;
                if (cropper) cropper.destroy();
                cropper = new Cropper(img, { viewMode: 1, autoCropArea: 0.4 });
                cropBtn.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        cropBtn.onclick = async function() {
            const canvas = cropper.getCroppedCanvas({ width: 800 });
            const base64Image = canvas.toDataURL('image/jpeg');
            
            cropBtn.style.display = 'none';
            loader.style.display = 'block';

            // Tesseract OCR İşlemi
            const result = await Tesseract.recognize(base64Image, 'eng+tur');
            const text = result.data.text;
            
            // Basit tarih yakalama (Regex)
            const dateMatch = text.match(/(\d{2}[.\/]\d{2}[.\/]\d{2,4})/);
            
            loader.style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('detected-date').textContent = dateMatch ? dateMatch[0] : "Tarih anlaşılamadı, manuel girin.";
        };
    </script>
</body>
</html>

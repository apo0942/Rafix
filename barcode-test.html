<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barkod Tarayıcı</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,sans-serif;
  background:#f5f2eb;
  padding:1.5rem;
  max-width:500px;
  margin:0 auto;
}

h1{
  font-size:22px;
  margin-bottom:1rem;
  color:#1a1712;
}

#reader{
  border-radius:12px;
  overflow:hidden;
  margin-bottom:1rem;
  position:relative;
}

/* 📱 iPhone için görsel zoom */
.zoomed video{
  transform: scale(1.8);
  transform-origin:center;
}

#result{
  padding:1rem;
  background:#fff;
  border-radius:12px;
  border:1.5px solid #e0ddd5;
  min-height:60px;
  font-size:15px;
  margin-bottom:10px;
}

#product-info{
  padding:1rem;
  background:#eaf4ee;
  border-radius:12px;
  border:1.5px solid #c4dfc9;
  margin-top:10px;
  display:none;
  font-size:14px;
  line-height:1.6;
}

button{
  width:100%;
  padding:12px;
  background:#c85a2a;
  color:#fff;
  border:none;
  border-radius:40px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
}

button.stop{
  background:#7a7570;
}
</style>
</head>

<body>

<h1>📷 Barkod Tarayıcı</h1>

<div id="reader"></div>
<div id="result">Taramayı başlatın.</div>
<div id="product-info"></div>

<button id="start-btn">Taramayı Başlat</button>
<button id="stop-btn" class="stop" style="display:none">Durdur</button>

<script>

let scanner;
let isScanning = false;

const startBtn = document.getElementById("start-btn");
const stopBtn = document.getElementById("stop-btn");
const resultBox = document.getElementById("result");
const infoBox = document.getElementById("product-info");
const readerDiv = document.getElementById("reader");

startBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", stopScanner);

function isIOS() {
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

async function startScanner() {
  if (isScanning) return;

  resultBox.textContent = "Kamera açılıyor...";
  startBtn.style.display = "none";
  stopBtn.style.display = "block";

  scanner = new Html5Qrcode("reader");

  try {
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: 200
      },
      onScanSuccess
    );

    // 📌 Android için gerçek zoom dene
    try {
      const track = scanner.getRunningTrack();
      const capabilities = track.getCapabilities();

      if (capabilities.zoom) {
        const zoomLevel = Math.min(2, capabilities.zoom.max);
        await track.applyConstraints({
          advanced: [{ zoom: zoomLevel }]
        });
      } else if (isIOS()) {
        // 📱 iPhone için görsel zoom
        readerDiv.classList.add("zoomed");
      }
    } catch(e) {
      if (isIOS()) {
        readerDiv.classList.add("zoomed");
      }
    }

    isScanning = true;
    resultBox.textContent = "📷 Barkodu çerçeveye hizalayın...";
  } catch (err) {
    resultBox.textContent = "❌ Kamera açılamadı: " + err;
    startBtn.style.display = "block";
    stopBtn.style.display = "none";
  }
}

async function stopScanner() {
  if (!scanner || !isScanning) return;

  try {
    await scanner.stop();
    await scanner.clear();
  } catch (e) {}

  readerDiv.classList.remove("zoomed");

  isScanning = false;
  startBtn.style.display = "block";
  stopBtn.style.display = "none";
}

async function onScanSuccess(decodedText) {
  resultBox.textContent = "✅ Barkod: " + decodedText;
  await stopScanner();
  lookupProduct(decodedText);
}

async function lookupProduct(code) {
  infoBox.style.display = "block";
  infoBox.textContent = "🔍 Ürün aranıyor...";

  try {
    const response = await fetch(
      `https://world.openfoodfacts.org/api/v0/product/${code}.json`
    );
    const data = await response.json();

    if (data.status === 1) {
      const p = data.product;
      const name = p.product_name_tr || p.product_name || "Ad bulunamadı";
      const brand = p.brands || "—";

      infoBox.innerHTML = `
        <strong>${name}</strong><br>
        Marka: ${brand}<br>
        Barkod: ${code}
      `;
    } else {
      infoBox.textContent = "⚠️ Ürün bulunamadı.";
    }
  } catch (e) {
    infoBox.textContent = "❌ Ürün bilgisi alınamadı.";
  }
}

</script>

</body>
</html>
